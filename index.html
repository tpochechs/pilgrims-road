<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pilgrim's Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pixel-art platformer in a framed "stage", HUD above, dialogs over the stage; results become a long candlelit page below. Deliberately single (night) theme. */
:root{
  --night:#0e1022; --vault:#161a32; --vault-2:#1d2240; --stone:#2c3255; --lead:#090b18;
  --parchment:#ece6d6; --muted:#a6a5bf; --candle:#f2dcaa; --candle-ink:#1b1608; --glass:#232945;
  --bui:#d4a24c; --adv:#6cc28a; --sch:#7fb2ff; --str:#ef7d45; --see:#a98bf5; --men:#e85d75;
  --f-display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#262b55 0%,transparent 70%);background-attachment:fixed;color:var(--parchment);font-family:var(--f-body);font-size:18px;line-height:1.5}
.shell{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[data-nav]:focus-visible{outline:3px solid var(--candle);outline-offset:2px}

.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--candle)}
.hud .lvl{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:1 1 220px}
.pips{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.pips i{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--muted);display:block}
.pips i.on{background:var(--candle);border-color:var(--candle)}
.lights{font-family:var(--f-mono);font-size:.8rem;color:var(--candle)}
.iconbtn{background:transparent;border:1px solid var(--stone);border-radius:3px;color:var(--muted);padding:4px 10px;font-size:.8rem;font-family:var(--f-mono)}
#mini svg{display:block}

.stagebox{position:relative;border:2px solid var(--stone);border-radius:6px;overflow:hidden;background:#000}
canvas#game{display:block;width:100%;height:auto;aspect-ratio:480/272;image-rendering:pixelated;image-rendering:crisp-edges}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(9,11,24,.88);border:1px solid var(--stone);color:var(--candle);padding:6px 14px;border-radius:3px;font-size:.95rem;pointer-events:none;max-width:90%;text-align:center}
.overlay{position:absolute;inset:0;background:rgba(9,11,24,.80);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.panel{background:var(--vault);border:1px solid var(--stone);border-radius:6px;padding:20px clamp(16px,3vw,28px);width:100%;max-width:680px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel.center{align-items:center;text-align:center}
.panel.center p{margin-inline:auto}
@media (max-width:760px){.overlay{position:fixed;inset:0;z-index:30;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}.panel{max-height:none}}

.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:500;color:var(--candle);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(2.3rem,6vw,3.4rem)}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h3{margin:0;font-size:1.1rem}
p{margin:0;max-width:64ch}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.prompt{font-size:1.2rem;font-weight:500;line-height:1.35;text-wrap:balance}
.scene{font-style:italic;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:.9rem;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--stone);border-bottom-width:2px;border-radius:3px;padding:1px 6px;color:var(--parchment);background:var(--vault-2)}

.who{display:flex;gap:12px;align-items:center}
.who canvas{width:42px;height:90px;image-rendering:pixelated;flex:none;background:var(--vault-2);border:1px solid var(--stone);border-radius:3px}
.who b{display:block;color:var(--candle);font-size:1.05rem}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--vault-2);border:1px solid var(--stone);border-radius:4px;padding:10px 14px;transition:border-color .12s,background .12s}
.opt:hover,.opt:focus-visible{border-color:var(--candle)}
.opt .k{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--stone);border-radius:2px;min-width:22px;height:22px;display:grid;place-items:center;flex:none;margin-top:2px}
.opt.sel{border-color:var(--candle);background:#2a2c45}
.opt.sel .k{background:var(--candle);color:var(--candle-ink);border-color:var(--candle)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .opt{justify-content:center;text-align:center;font-size:1.15rem;padding:22px 12px;align-items:center}
.vs .or{font-family:var(--f-display);font-size:1.5rem;color:var(--muted);align-self:center}
@media (max-width:460px){.vs{grid-template-columns:1fr}.vs .or{text-align:center}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab div{background:var(--vault-2);border:1px solid var(--stone);border-radius:4px;padding:10px 12px;font-size:1rem}
.ab b{font-family:var(--f-mono);color:var(--candle);margin-right:6px}
@media (max-width:460px){.ab{grid-template-columns:1fr}}
.scale{display:flex;justify-content:space-between;gap:6px}
.scale .opt{flex:1;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 4px;font-size:.85rem}
.scale .dot{border-radius:50%;border:2px solid var(--muted);display:block}
.scale .opt.sel .dot{background:var(--candle);border-color:var(--candle)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.chip{text-align:left;background:var(--vault-2);border:1px solid var(--stone);border-radius:4px;padding:9px 12px;font-size:.98rem}
.chip:hover{border-color:var(--candle)}
.chip.sel{border-color:var(--candle);background:#2a2c45;box-shadow:inset 3px 0 0 var(--candle)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.nav{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--candle);color:var(--candle-ink);border:0;border-radius:3px;padding:11px 22px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--stone);border-radius:3px;padding:9px 16px;color:var(--muted)}
.ghost:hover{color:var(--parchment);border-color:var(--muted)}
input[type=text],input[type=email]{width:100%;max-width:420px;background:var(--night);border:1px solid var(--stone);border-radius:4px;padding:11px 14px;font-size:1.1rem;text-align:center}
textarea{width:100%;min-height:96px;background:var(--night);border:1px solid var(--stone);border-radius:4px;color:var(--parchment);font:inherit;font-size:1rem;padding:10px 12px;resize:vertical}

.touch{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.touch div{display:flex;gap:10px}
.touch button{width:72px;height:60px;border-radius:8px;background:var(--vault-2);border:1px solid var(--stone);font-size:1.4rem;color:var(--candle);touch-action:none}
.touch button.jump{width:110px;font-family:var(--f-mono);font-size:.9rem;letter-spacing:.1em}
@media (pointer:coarse){.touch{display:flex}}

/* results */
.results{display:flex;flex-direction:column;gap:16px}
.card{background:var(--vault);border:1px solid var(--stone);border-radius:6px;padding:24px clamp(16px,3.5vw,32px);display:flex;flex-direction:column;gap:14px}
.path-card{position:relative;overflow:hidden;background:var(--vault-2)}
.path-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--pc)}
.path-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.path-head h2{color:var(--pc)}
.rank{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pct{font-family:var(--f-mono);font-size:1.6rem;color:var(--pc);font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.pct small{font-size:.68rem;color:var(--muted);display:block;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.motto{font-family:var(--f-display);font-size:1.4rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cols>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.9rem;border:1px solid var(--pc);color:var(--pc);border-radius:2px;padding:2px 8px}
.quote{border-left:3px solid var(--pc);padding:4px 0 4px 12px;font-style:italic}
.verse{font-family:var(--f-display);font-size:1.3rem;line-height:1.25;color:var(--parchment)}
.verse small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;margin-top:6px}
.evidence li{font-style:italic}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.orders>div{border-left:3px solid var(--pc);padding:8px 12px;background:var(--vault);display:flex;flex-direction:column;gap:2px;min-width:0}
.orders b{color:var(--pc)}
.orders span{font-size:.95rem}
.portrait{width:42px;height:90px;image-rendering:pixelated;flex:none;background:var(--vault-2);border:1px solid var(--stone);border-radius:3px}
.opt .k{padding:0 4px}
.try{border-left:3px solid var(--pc);padding:10px 14px;background:var(--vault)}
.second{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.second .path-card h2{font-size:1.8rem}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:.95rem}
.brow .track{height:12px;background:var(--glass);border-radius:2px;overflow:hidden}
.brow .track span{display:block;height:100%;background:var(--pc)}
.brow .n{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.result-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.result-top>div{min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:600px){.result-top{grid-template-columns:1fr;justify-items:center;text-align:center}.brow{grid-template-columns:92px 1fr 40px}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i,.sw{width:10px;height:10px;transform:rotate(45deg);background:var(--pc);display:inline-block}
.type{display:flex;gap:10px;flex-wrap:wrap}
.letter{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--vault-2);border:1px solid var(--stone);border-radius:4px;padding:10px 8px;width:92px}
.letter b{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--candle)}
.letter small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.letter:hover{border-color:var(--candle)}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini-cards>div{border:1px solid var(--stone);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini-cards b{color:var(--pc)}
.status{font-size:.95rem;padding:10px 14px;border-radius:4px;border:1px solid var(--stone);background:var(--vault-2)}
.status.ok{border-color:#3f7a55;color:#bfe8cc}
.status.bad{border-color:#8a4a3a;color:#f3c9b8}

/* teacher */
.tablewrap{overflow-x:auto;border:1px solid var(--stone);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:760px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--stone);vertical-align:top}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--vault-2)}
td .sw{margin-right:6px}
.del{background:transparent;border:0;color:var(--muted);text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
a.btn{display:inline-block;text-decoration:none}
</style>
</head>
<body>

<div class="shell">
  <header class="hud" id="hud">
    <div class="brand">The Pilgrim's Road</div>
    <div class="lvl" id="lvl"></div>
    <div class="pips" id="pips"></div>
    <div class="lights" id="lights"></div>
    <button class="iconbtn" id="mute" type="button">Sound on</button>
    <div id="mini"></div>
  </header>
  <section id="gamewrap">
    <div class="stagebox">
      <canvas id="game" tabindex="-1" width="480" height="272" aria-label="Platform game. Use arrow keys to move and Space or Up to jump."></canvas>
      <div class="toast" id="toast" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>
    <div class="touch" id="touch" style="margin-top:10px">
      <div><button type="button" data-k="left" aria-label="Move left">&#9664;</button><button type="button" data-k="right" aria-label="Move right">&#9654;</button></div>
      <div><button type="button" class="jump" data-k="jump">JUMP</button></div>
    </div>
  </section>
  <section id="results" class="results" hidden></section>
  <section id="teacher" class="results" hidden></section>
</div>

<script>
/* ===== TEACHER SETUP =====
   Paste your Microsoft Forms pre-filled link between the quotes below.
   Make it with these answers typed into the form: XNAMEX, XEMAILX, XPATH1X, XPATH2X, XPATH3X, XTYPEX, XSCORESX, XSUMMARYX
   (see SETUP.md). Leave it empty and students will only be able to copy their results. */
const FORM_URL = "";
</script>
<script>
/* ================= THE SIX PATHS ================= */
const PATHS = {

/* Evidence: the student's own answers that point to a path */
function evidence(k){
  const out=[];
  ENCS.forEach(e=>{const a=state.ans[e.id];if(a===undefined)return;
    if(e.t==="road"){a.forEach((oi,i)=>{const o=ROAD[e.r].o[oi];if((o[1][k]||0)>=2)out.push(`Your ${ORD[i]} choice: ${o[0]}`)})}
    else if(e.t==="rapid"){const q=RAPID[e.r];const pick=a===0?0:2;if(q[pick+1]===k)out.push(`You chose “${q[pick]}” over “${q[pick===0?2:0]}.”`)}
    else if(e.t==="acts"){a.forEach(i=>{if(ACTS[i][1]===k)out.push(`On a free Saturday: ${ACTS[i][0].toLowerCase()}.`)})}
    else if(e.t==="strengths"){a.forEach(i=>{if(STRS[i][1]===k)out.push(`You named ${STRS[i][0].toLowerCase()} as one of your strengths.`)})}
    else if(e.t==="bigq"&&a[0]===k){out.unshift(`In the chapel, the question you ask God most: “${PATHS[k].q}”`)}});
  return out;
}

  const ev=k=>evidence(k);
  const big=x=>{const p=PATHS[x.k],e=ev(x.k).slice(0,5);return`<article class="card path-card" ${pc(x.k)}>
    <div class="path-head"><div><div class="rank">Your first path · ${p.order} spirituality</div><h2 style="font-size:clamp(2.2rem,6vw,3rem)">${p.name}</h2></div><div class="pct">${pct(x.v)}%<small>match</small></div></div>
    <div class="motto">“${p.motto}”</div>
    <p><b>The question at the heart of this path:</b> ${esc(p.q)}</p>
    <p>${esc(p.desc)}</p>
    <div><div class="lbl">Religious orders who live this spirituality</div><div class="orders" style="margin-top:6px">${ORDERS[x.k].map(o=>`<div><b>${o[0]}</b><span>${o[1]}</span></div>`).join("")}</div><p class="note" style="margin-top:8px">You don't have to become a priest, brother, or sister to live this path. Lay people with families and jobs can join the ${LAY[x.k]}.</p></div>
    ${e.length?`<div><div class="lbl">Why this fits you: your own answers</div><ul class="evidence">${e.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <div class="cols">
      <div><div class="lbl">Your strengths on this path</div><div class="tags">${p.strengths.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="lbl" style="margin-top:8px">You might be a ${p.name.replace("The ","")} if</div><ul>${p.ifs.map(t=>`<li>${t}</li>`).join("")}</ul></div>
      <div><div class="lbl">Watch out for</div><p>${p.edge}</p></div>
      <div><div class="lbl">How you might pray best</div><ul>${p.pray.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    </div>
    <div class="verse">“${p.verse[0]}”<small>${p.verse[1]}</small></div>
    <div><div class="lbl">Saints who walked this road</div><ul>${p.saints.map(s=>`<li><b>${s[0]}.</b> ${s[1]}</li>`).join("")}</ul></div>
    <div class="cols"><div><div class="lbl">Ways to live it now</div><ul>${p.live.map(t=>`<li>${t}</li>`).join("")}</ul></div><div><div class="lbl">Where this path can lead</div><p>${p.lead}</p></div></div>
    <div class="try"><div class="lbl">Try this week</div><p>${p.tryit}</p></div></article>`};
  const mid=(x,i)=>{const p=PATHS[x.k],e=ev(x.k).slice(0,3);return`<article class="card path-card" ${pc(x.k)}>
    <div class="path-head"><div><div class="rank">${i===1?"Your second path":"Your third path"} · ${p.order} spirituality</div><h2>${p.name}</h2></div><div class="pct">${pct(x.v)}%<small>match</small></div></div>
    <div class="motto">“${p.motto}”</div><p><b>Its question:</b> ${esc(p.q)}</p><p>${esc(p.desc)}</p>
    <div><div class="lbl">Religious orders who live it</div><ul>${ORDERS[x.k].map(o=>`<li><b style="color:var(--pc)">${o[0]}</b></li>`).join("")}</ul><p class="note">For lay people: ${LAY[x.k]}</p></div>
    ${e.length?`<div><div class="lbl">From your answers</div><ul class="evidence">${e.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <div class="tags">${p.strengths.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    <div><div class="lbl">A way to pray</div><p>${p.pray[0]}</p></div>
    <div><div class="lbl">Walk with</div><p>${p.saints.map(s=>s[0]).join(", ")}</p></div>
    <div class="verse" style="font-size:1.1rem">“${p.verse[0]}”<small>${p.verse[1]}</small></div>
    <div class="try"><div class="lbl">Try this week</div><p>${p.tryit}</p></div></article>`};
  const letters=type.split("");
  const typeDesc=letters.map(l=>TRAITS[l]).filter(Boolean);
  const js=Object.keys(JOURNAL).filter(k=>(state.journal[k]||"").trim());
  $("results").innerHTML=`
  <div class="card"><div class="result-top">${rose(190)}<div>
    <div class="eyebrow">The Summit · Results for ${esc(state.name||"you")}</div>
    <h1>${esc(nm)}, your road leads to ${first.name.replace("The ","the ")}</h1>
    <p>Your top three paths are <b style="color:${PATHS[top[0].k].color}">${PATHS[top[0].k].name}</b>, <b style="color:${PATHS[top[1].k].color}">${PATHS[top[1].k].name}</b>, and <b style="color:${PATHS[top[2].k].color}">${PATHS[top[2].k].name}</b>.</p>
    <p class="muted">Personality type: <b style="color:var(--parchment)">${type}</b>${heroK?` · The story that moved you most was about <b style="color:var(--parchment)">${HEROES[heroK]}</b>`:""} · ${state.lights} lights collected</p>
    <div id="savestatus" class="status">Getting your results ready…</div><div><a class="btn" id="sendlink" href="#" target="_blank" rel="noopener" hidden>Send my results</a></div>
  </div></div><div class="legend">${KEYS.map(k=>`<span ${pc(k)}><i></i>${PATHS[k].name}</span>`).join("")}</div></div>
  ${big(top[0])}
  <div class="card"><div class="eyebrow">Your combination</div><h2>${PATHS[top[0].k].name.replace("The ","")} + ${PATHS[top[1].k].name.replace("The ","")}</h2><p>${BLEND[blendKey(top[0].k,top[1].k)]}</p></div>
  <div class="second">${mid(top[1],1)}${mid(top[2],2)}</div>
  <div class="card"><div class="eyebrow">Your personality type</div><h2>${type}</h2>
    <p>Your answers describe someone who ${typeDesc.slice(0,-1).join(", ")}${typeDesc.length>1?", and ":""}${typeDesc.slice(-1)}. If you've taken the full Myers-Briggs and got something different, tap a letter to switch it. Your paths will update.</p>
    <div class="type">${DIMS.map((d,di)=>{const s=sh[di],L=s>0?d[0]:s<0?d[1]:"?";const name=s>0?d[2]:s<0?d[3]:`${d[2]} / ${d[3]}`;return`<button class="letter" data-act="flip" data-d="${di}" aria-label="${name}. Tap to switch."><b>${L}</b><small>${name}</small><small>${state.override[di]?"set by you":L==="?"?"tie":Math.round(Math.abs(s)*50+50)+"% lean"}</small></button>`}).join("")}</div>
    <div class="lbl">How your type can grow in prayer</div><ul>${letters.filter(l=>TIPS[l]).map(l=>`<li>${TIPS[l]}</li>`).join("")}</ul>
    <p class="note">This is a short, informal version of Myers-Briggs, a starting point for reflection and not an official result.</p></div>
  <div class="card"><div class="eyebrow">All six paths</div>
    <div class="bars">${sc.map(x=>`<div class="brow" ${pc(x.k)}><span>${PATHS[x.k].name.replace("The ","")}</span><div class="track"><span style="width:${pct(x.v)}%"></span></div><span class="n">${pct(x.v)}%</span></div>`).join("")}</div>
    <p class="note">Everyone has a bit of every path. These results are pointers for prayer and conversation, not a label. Talk them over with a campus minister, a Brother, or a teacher you trust.</p>
    <div class="lbl">The other roads</div><div class="mini-cards">${rest.map(x=>{const p=PATHS[x.k];return`<div ${pc(x.k)}><b>${p.name}</b><span class="note">${p.order} · ${p.motto}</span><span style="font-size:.95rem">${esc(p.q)}</span><span class="note">Lived by: ${ORDERS[x.k].map(o=>o[0]).join(", ")}</span></div>`}).join("")}</div></div>
  <div class="card"><div class="eyebrow">The six paths and the religious orders who live them</div>
    <div class="tablewrap"><table><thead><tr><th>Path</th><th>Spirituality</th><th>Religious orders</th><th>For lay people</th></tr></thead><tbody>${sc.map(x=>`<tr ${pc(x.k)}><td><i class="sw"></i> <b style="color:var(--pc)">${PATHS[x.k].name}</b></td><td>${PATHS[x.k].order}</td><td>${ORDERS[x.k].map(o=>o[0]).join("<br>")}</td><td>${LAY[x.k]}</td></tr>`).join("")}</tbody></table></div></div>
  ${js.length?`<div class="card"><div class="eyebrow">Your journal (private, not saved)</div>${js.map(k=>`<div><p class="note">${JOURNAL[k]}</p><p>${esc(state.journal[k])}</p></div>`).join("")}</div>`:""}
  <div class="card"><div class="nav" style="justify-content:space-between"><span class="note" id="copynote"></span><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" data-act="again" id="againbtn">Play again</button><button class="btn" data-act="copy">Copy my results</button></div></div><textarea id="copybox" readonly hidden></textarea></div>`;
  saveResult();
}
function summaryText(){const sc=scores();const L2=[`THE PILGRIM'S ROAD: RESULTS FOR ${state.name.toUpperCase()}`,""];
  sc.slice(0,3).forEach((x,i)=>{const p=PATHS[x.k];L2.push(`${i+1}. ${p.name} (${p.order}): ${pct(x.v)}% match`,`   Motto: ${p.motto}`,`   Religious orders: ${ORDERS[x.k].map(o=>o[0]).join(", ")}`,`   Question: ${p.q}`,`   Try this week: ${p.tryit}`,"")});
  L2.push(`Combination: ${BLEND[blendKey(sc[0].k,sc[1].k)]}`,"",`Personality type (informal): ${typeString()}`,"All paths: "+sc.map(x=>`${PATHS[x.k].name.replace("The ","")} ${pct(x.v)}%`).join(", "));return L2.join("\n")}

/* ================= SAVING (teacher log) ================= */
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n):Promise.resolve(null);
let lastSave=null;
function setSaveStatus(kind,msg){lastSave=[kind,msg];const el=$("savestatus");if(!el)return;el.className="status "+kind;el.textContent=msg}
function formUrl(){
  if(!FORM_URL)return"";const sc=scores();const nm=k=>k?PATHS[k].name.replace("The ",""):"";
  const line=x=>`${PATHS[x.k].name} (${PATHS[x.k].order} spirituality), ${pct(x.v)}% match. Motto: ${PATHS[x.k].motto}`;
  const p=PATHS[sc[0].k];
  const summary=`Your top path is ${p.name} (${p.order} spirituality). Its question: ${p.q} Religious orders who live it: ${ORDERS[sc[0].k].map(o=>o[0]).join(", ")}. Lay people can join the ${LAY[sc[0].k]}. Saints to know: ${p.saints.map(s=>s[0]).join(", ")}. Try this week: ${p.tryit} Your combination of ${nm(sc[0].k)} and ${nm(sc[1].k)}: ${BLEND[blendKey(sc[0].k,sc[1].k)]}`;
  const vals={XNAMEX:state.name,XEMAILX:state.email||"",XPATH1X:line(sc[0]),XPATH2X:line(sc[1]),XPATH3X:line(sc[2]),XTYPEX:typeString(),
    XSCORESX:sc.map(x=>nm(x.k)+" "+pct(x.v)+"%").join(", "),XSUMMARYX:summary};
  let u=FORM_URL;for(const t in vals)u=u.split(t).join(encodeURIComponent(vals[t]));return u}
function saveResult(){
  const u=formUrl(),a=$("sendlink");
  if(u){if(a){a.href=u;a.hidden=false}setSaveStatus("","Last step: press “Send my results,” sign in if asked, then press Submit on the form. Your results will arrive in your email a minute later.")}
  else{if(a)a.hidden=true;setSaveStatus("bad","Your teacher hasn't connected the results form yet. Use Copy my results at the bottom of the page and send it to your teacher.")}
}
/* ================= TEACHER VIEW ================= */
let teacherUnsub=null,teacherRows=[];
async function checkOwner(){try{const user=await use("user");if(user&&await user.isOwner()){const b=$("teacherbtn");if(b)b.hidden=false}}catch(e){}}
async function openTeacher(){
  mode="teacher";hideOverlay();$("gamewrap").hidden=true;$("hud").hidden=true;$("results").hidden=true;$("teacher").hidden=false;
  $("teacher").innerHTML=`<div class="card"><div class="eyebrow">Teacher view · only you can see this</div><h2>Student results</h2>
    <p class="muted">Each student's latest play-through. Results are a starting point for conversation, not a grade or a ranking.</p>
    <div id="tstat" class="note">Loading results…</div><div class="tablewrap" id="twrap"></div>
    <div class="nav" style="justify-content:space-between"><button class="ghost" data-act="tback">Back to the game</button><div style="display:flex;gap:10px;align-items:center"><span class="note" id="tcopynote"></span><button class="btn" data-act="tcopy">Copy for a spreadsheet</button></div></div>
    <textarea id="tcopybox" readonly hidden></textarea></div>`;
  window.scrollTo({top:0});
  const db=await use("db");if(!db){$("tstat").textContent="Results storage isn't available in this view.";return}
  if(teacherUnsub)return drawTeacher();
  const timer=setTimeout(()=>{if($("tstat"))$("tstat").textContent="Still loading. The results store may be unreachable right now."},10000);
  teacherUnsub=db.collection("results").onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);teacherRows=snap.docs.map(d=>({id:d.id,...d.data()}));drawTeacher()},err=>{clearTimeout(timer);if($("tstat"))$("tstat").textContent="Couldn't load results ("+err.code+")."});
}
async function drawTeacher(){
  if(!$("twrap"))return;const rows=[...teacherRows].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  $("tstat").textContent=rows.length?`${rows.length} student${rows.length===1?"":"s"} so far, sorted by name.`:"No results yet. They appear here as students finish.";
  let profs={};try{const user=await use("user");if(user)profs=await user.profiles(rows.map(r=>r.id))}catch(e){}
  const pn=k=>k&&PATHS[k]?`<span ${pc(k)}><i class="sw"></i>${PATHS[k].name.replace("The ","")} <span class="note">${rowsMap[k]!=null?rowsMap[k]+"%":""}</span></span>`:"";
  let rowsMap={};
  $("twrap").innerHTML=rows.length?`<table><thead><tr><th>Name typed</th><th>Claude account</th><th>Finished</th><th>Path 1</th><th>Path 2</th><th>Path 3</th><th>Type</th><th></th></tr></thead><tbody>${rows.map(r=>{rowsMap=r.scores||{};const t=r.top||[];
    return`<tr><td>${esc(r.name||"(no name)")}</td><td>${esc((profs[r.id]&&profs[r.id].name)||"Unknown")}</td><td>${r.savedAt?esc(new Date(r.savedAt).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})):""}</td><td>${pn(t[0])}</td><td>${pn(t[1])}</td><td>${pn(t[2])}</td><td>${esc(r.type||"")}</td><td><button class="del" data-act="tdel" data-id="${esc(r.id)}">Remove</button></td></tr>`}).join("")}</tbody></table>`:"";
}
function teacherTSV(){const rows=[...teacherRows].sort((a,b)=>(a.name||"").localeCompare(b.name||""));const n=k=>k&&PATHS[k]?PATHS[k].name.replace("The ",""):"";
  return["Name\tFinished\tPath 1\tPath 2\tPath 3\tType\t"+KEYS.map(k=>PATHS[k].name.replace("The ","")+" %").join("\t"),...rows.map(r=>{const t=r.top||[];return[r.name||"",r.savedAt||"",n(t[0]),n(t[1]),n(t[2]),r.type||"",...KEYS.map(k=>(r.scores||{})[k]??"")].join("\t")})].join("\n")}

/* ================= INPUT ================= */
function copyText(txt,boxId,noteId,okMsg){const fb=()=>{const b=$(boxId);b.hidden=false;b.value=txt;b.style.minHeight="200px";b.focus();b.select();$(noteId).textContent="Select all and copy the text below."};
  try{navigator.clipboard.writeText(txt).then(()=>$(noteId).textContent=okMsg,fb)}catch(e){fb()}}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="begin"){const nm=$("nm").value.trim();if(nm.split(/\s+/).length<2){toast("Please type your first and last name.");$("nm").focus();return}
    state.name=nm;const em=$("em").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("Please type your school email address.");$("em").focus();return}state.email=em;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(err){}state.level=0;levelIntro()}
  else if(a==="teacher")openTeacher();
  else if(a==="play")play();
  else if(a==="ans"){if(performance.now()-openedAt<250)return;answer(b.dataset.v)}
  else if(a==="rank"){const v=curNpc.e.t==="bigq"?b.dataset.v:+b.dataset.v;const at=rankSel.indexOf(v);if(at>=0)rankSel.splice(at,1);else if(rankSel.length<3)rankSel.push(v);renderEncounter()}
  else if(a==="rankdone"){if(rankSel.length===3)answer([...rankSel])}
  else if(a==="dback"){const pe=ENCS[curNpc.e.id-1];const pn=L.npcs.find(n=>n.e===pe);if(pn)openEncounter(pn)}
  else if(a==="dclose")play();
  else if(a==="next")nextLevel();
  else if(a==="results")showResults();
  else if(a==="flip"){const di=+b.dataset.d,d=DIMS[di];state.override[di]=typeString()[di]===d[0]?d[1]:d[0];renderResults();saveResult()}
  else if(a==="copy")copyText(summaryText(),"copybox","copynote","Copied.");
  else if(a==="again"){if(b.dataset.confirm){const nm=state.name,em0=state.email;state=freshState(nm);state.email=em0;lastSave=null;$("results").hidden=true;$("gamewrap").hidden=false;$("hud").hidden=false;titleScreen()}else{b.dataset.confirm="1";b.textContent="Tap again to start over"}}
  else if(a==="tback"){$("teacher").hidden=true;$("gamewrap").hidden=false;$("hud").hidden=false;titleScreen()}
  else if(a==="tcopy")copyText(teacherTSV(),"tcopybox","tcopynote","Copied. Paste into a spreadsheet.");
  else if(a==="tdel"){if(b.dataset.confirm){const db=await use("db");if(db)try{await db.doc("results/"+b.dataset.id).delete()}catch(err){toast("Couldn't remove that row.")}}else{b.dataset.confirm="1";b.textContent="Confirm remove"}}
});
document.addEventListener("input",e=>{const j=e.target.dataset&&e.target.dataset.j;if(j)state.journal[j]=e.target.value});
const GAMEKEYS={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"jump",KeyW:"jump",Space:"jump",KeyZ:"jump"};
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"");
  if(mode==="play"&&["ArrowDown","KeyS","KeyE","Enter"].includes(e.code)){e.preventDefault();if(!e.repeat)talkQ=true;return}
  if(mode==="play"){const k=GAMEKEYS[e.code];if(k){e.preventDefault();if(k==="jump"&&!e.repeat&&!keys.jump)jumpQ=true;keys[k]=true}return}
  if(ov.hidden)return;
  if(e.key==="Escape"&&mode==="dialog"&&curNpc&&curNpc.met){e.preventDefault();play();return}
  if(tag==="TEXTAREA"&&e.key!=="Escape")return;
  if(tag==="INPUT"){if(e.key==="Enter"){e.preventDefault();$("beginbtn").click()}return}
  const items=[...ov.querySelectorAll("[data-nav]:not([disabled])")];if(!items.length)return;
  const idx=items.indexOf(document.activeElement);
  if(["ArrowDown","ArrowRight"].includes(e.key)){e.preventDefault();items[(idx+1+items.length)%items.length].focus()}
  else if(["ArrowUp","ArrowLeft"].includes(e.key)){e.preventDefault();items[(idx-1+items.length)%items.length].focus()}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(e.repeat||performance.now()-openedAt<350)return;(idx>=0?items[idx]:items[0]).click()}
  else if(/^[1-9]$/.test(e.key)){const opts=[...ov.querySelectorAll(".opt")];const o=opts[+e.key-1];if(o&&performance.now()-openedAt>350)o.click()}
});
document.addEventListener("keyup",e=>{
  const k=GAMEKEYS[e.code];if(k){keys[k]=false;if(mode==="play")e.preventDefault()}
  if((e.key===" "||e.key==="Enter")&&e.target.tagName==="BUTTON")e.preventDefault();
});
window.addEventListener("blur",()=>{keys.left=keys.right=keys.jump=false});
document.querySelectorAll("#touch button").forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(k==="jump"&&!keys.jump)jumpQ=true;keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};
  b.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,off))});

/* ================= LOOP ================= */
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){if(mode==="play"&&L)step();else if(L)L.t++;acc-=1000/60}render();requestAnimationFrame(frame)}

function start(saved){
  if(saved&&saved.v===2&&saved.order&&saved.ans){state=saved}
  titleScreen();requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>state);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
